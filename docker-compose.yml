version: '3'
services:
  mall4j-mysql:
    build:
      context: ./
      dockerfile: ./db/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: root
    restart: always
    container_name: mall4j-mysql
    image: mall4j-mysql
    ports:
      - 3306:3306
    volumes:
      - mall4j-mysql8-data:/var/lib/mysql
    command: --lower_case_table_names=1

  mall4j-redis:
    image: redis:5.0.4
    restart: always
    container_name: mall4j-redis
    ports:
      - 6379:6379

  mall4j-admin:
    build:
      context: ./
      dockerfile: ./yami-shop-admin/Dockerfile
    restart: always
    container_name: mall4j-admin
    image: mall4j-admin
    ports:
      - 8085:8085
    environment:
      REDIS_HOST: mall4j-redis
      REDIS_PORT: 6379
    depends_on:
      - mall4j-redis
      - mall4j-mysql
    links:
      - "mall4j-redis"
      - "mall4j-mysql"

  mall4j-api:
    build:
      context: ./
      dockerfile: ./yami-shop-api/Dockerfile
    restart: always
    container_name: mall4j-api
    image: mall4j-api
    ports:
      - 8086:8086
    environment:
      REDIS_HOST: mall4j-redis
      REDIS_PORT: 6379
    depends_on:
      - mall4j-redis
      - mall4j-mysql
    links:
      - "mall4j-redis"
      - "mall4j-mysql"

  mall4j-nginx:
    image: nginx:1.20.1
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mall4j-admin
      - mall4j-api

volumes:
  mall4j-mysql8-data:
